services:
  postgres:
    image: postgres
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
    ports:
      - "5432:5432"
    volumes:
      - server-db:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: ./server/Dockerfile
      args:
        NODE_ENV: "${NODE_ENV}"
        STREAMA_ENDPOINT: "${STREAMA_ENDPOINT}"
        API_ENDPOINT: "${API_ENDPOINT}"
        ADMIN_SECRETS: "${ADMIN_SECRETS}"
        SUPERUSER_SECRETS: "${SUPERUSER_SECRETS}"
    environment:
      NODE_ENV: "${NODE_ENV}"
      DB_SCHEMA: "${DB_SCHEMA}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_HOST: "${DB_HOST}"
      # Agent API tokens (rentify + sortify). Agent routes 401 until set.
      PIPELINE_API_TOKEN: "${PIPELINE_API_TOKEN}"
      SORTIFY_API_TOKEN: "${SORTIFY_API_TOKEN}"
      # Streama identity used to gate admin/magnet access in production.
      ADMIN_SECRETS: "${ADMIN_SECRETS}"
      SUPERUSER_SECRETS: "${SUPERUSER_SECRETS}"
      # Optional TMDB key for server-side magnet lookup (falls back to bundled).
      TMDB_API_KEY: "${TMDB_API_KEY}"
      # Streama library lookup (TMDB apiId). Missing login → Check Manually for released titles (unreleased stay Not Yet Available).
      STREAMA_URL: "${STREAMA_URL}"
      STREAMA_ENDPOINT: "${STREAMA_ENDPOINT}"
      STREAMA_USERNAME: "${STREAMA_USERNAME}"
      STREAMA_PASSWORD: "${STREAMA_PASSWORD}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
    ports:
      - "3000:3000"

  client:
    build:
      context: .
      dockerfile: ./client/Dockerfile
      args:
        NODE_ENV: "${NODE_ENV}"
        STREAMA_ENDPOINT: "${STREAMA_ENDPOINT}"
        API_ENDPOINT: "${API_ENDPOINT}"
        ADMIN_SECRETS: "${ADMIN_SECRETS}"
        SUPERUSER_SECRETS: "${SUPERUSER_SECRETS}"
    environment:
      NODE_ENV: "${NODE_ENV}"
      STREAMA_ENDPOINT: "${STREAMA_ENDPOINT}"
      API_ENDPOINT: "${API_ENDPOINT}"
      ADMIN_SECRETS: "${ADMIN_SECRETS}"
      SUPERUSER_SECRETS: "${SUPERUSER_SECRETS}"
    ports:
      - "8081:8081"

volumes:
  server-db: # named volumes can be managed easier using docker-compose
